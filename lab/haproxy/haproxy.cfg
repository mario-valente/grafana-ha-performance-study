# HAProxy do lab: round-robin SEM stickiness.
# A sessão Grafana é um auth token gravado no banco compartilhado, então
# qualquer nó aceita qualquer usuário — a config do LB só precisa detectar
# nó morto rápido e redistribuir.
# (obs: sticky/ip_hash aqui é considerado DANOSO — pin ao nó morto)

defaults
    mode http
    timeout connect 1s
    timeout client 5s
    timeout server 5s

frontend f
    bind 0.0.0.0:80
    default_backend grafana

backend grafana
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server g1 grafana-1:3000 check inter 500ms fall 2 rise 1
    server g2 grafana-2:3000 check inter 500ms fall 2 rise 1
